name = 'gw2w2w-cloudflare'
main = "./workers/app.ts"
compatibility_date = "2026-01-01"

compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Ships the sourcemaps Vite emits so Workers stack traces symbolicate to real source lines.
upload_source_maps = true


[assets]
directory = "./build/client"

[[routes]]
pattern = "gw2w2w.com"
custom_domain = true

[[routes]]
pattern = "www.gw2w2w.com"
custom_domain = true

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "gw2w2w-cloudflare"

[[services]]
binding = "SERVICE_EMBLEM"
service = "service-emblem"

[[services]]
binding = "SERVICE_API"
service = "service-api"

[limits]
cpu_ms = 100
subrequests = 1000

[[kv_namespaces]]
binding = "EMBLEM_ENGINE_GUILD_LOOKUP"
id = "24797f12df1d4f8197edadc01d10535c"

[[r2_buckets]]
binding = "EMBLEM_ASSETS"
bucket_name = "emblem-assets-dev"

[vars]
GW2_API_BASE = "https://api.guildwars2.com/v2"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
