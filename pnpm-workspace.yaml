packages:
  - 'apps/*'
  - 'packages/*'

# Lets root-level `pnpm add` (and similar mutating commands) run without requiring -w each
# time — this repo manages shared devDependencies (turbo, typescript, oxlint, etc.) directly
# at the root. Plain `pnpm install` was never gated by this check in the first place.
ignoreWorkspaceRootCheck: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  postcss: '>=8.5.10' # GHSA-qx2v-qp2m-jg93 — floors transitive postcss (Tailwind/Vite) above the vulnerable range
  esbuild: '>=0.28.1' # GHSA-67mh-4wv8-2f99 — floors transitive esbuild (Vite toolchain) above the vulnerable range
  # `qs` and `form-data` overrides were dropped with @opennextjs/*; neither package is in the tree any more.

catalog:
  '@cloudflare/workers-types': '^5.20260710.1'
  '@types/lodash-es': '^4.17.12'
  '@types/node': '^26.1.1'
  hono: '^4.12.29'
  'lodash-es': '^4.18.1'
  typescript: '^7.0.2'
  vite: '^8.2.2'
  vitest: '^4.1.10'
  wrangler: '^4.129.0'
  zod: '^4.4.3'
